<div class="flex h-screen w-screen overflow-hidden bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans">
  
  <!-- Left Persistent Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Right Main Area (Sticky Navbar + Scrollable View) -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    
    <!-- Top Navigation Bar -->
    <app-navbar
      (openNewDealModal)="openNewDealModal()"
      (openEmailComposer)="openEmailComposer()">
    </app-navbar>

    <!-- Main Content Routed Views -->
    <main class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col min-h-0">
      <div class="w-full flex-1 flex flex-col min-h-0">
        <router-outlet></router-outlet>
      </div>
    </main>

  </div>

  <!-- Global Toast Notification Layer -->
  <app-toast-container></app-toast-container>

  <!-- Global New Deal Modal -->
  <app-modal
    [isOpen]="isGlobalDealModalOpen"
    title="Create Sales Deal"
    subtitle="Add directly to active tenant pipeline"
    icon="plus"
    badge="Deal Flow"
    maxWidth="680px"
    (close)="isGlobalDealModalOpen = false">

    <form (ngSubmit)="submitNewDeal()" class="space-y-4">
      <div class="p-4 rounded-2xl bg-slate-50/80 dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 space-y-3.5">
        <div>
          <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
            Deal Title <span class="text-rose-500">*</span>
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <app-icon name="briefcase" [size]="14"></app-icon>
            </span>
            <input
              type="text"
              [(ngModel)]="dealTitle"
              name="title"
              required
              placeholder="e.g. Acme Corp - Global License Expansion"
              class="w-full pl-9 pr-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition shadow-2xs">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <div>
            <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
              Company <span class="text-rose-500">*</span>
            </label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <app-icon name="building" [size]="14"></app-icon>
              </span>
              <select
                [(ngModel)]="dealCompanyId"
                (ngModelChange)="onCompanySelected($event)"
                name="companyId"
                required
                class="w-full appearance-none pl-9 pr-8 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 shadow-2xs">
                @for (comp of crmState.tenantCompanies(); track comp.id) {
                  <option [value]="comp.id">{{ comp.name }} ({{ comp.tier }})</option>
                }
              </select>
              <span class="absolute inset-y-0 right-0 pr-2.5 flex items-center pointer-events-none text-slate-400">
                <app-icon name="chevron-down" [size]="13"></app-icon>
              </span>
            </div>
          </div>

          <div>
            <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
              Deal Value ({{ crmState.currencySymbol() }})
            </label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 font-bold text-xs">
                {{ crmState.currencySymbol() }}
              </span>
              <input
                type="number"
                [(ngModel)]="dealValue"
                name="value"
                placeholder="50000"
                class="w-full pl-8 pr-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 shadow-2xs">
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Stage</label>
            <div class="relative">
              <select
                [(ngModel)]="dealStageId"
                name="stage"
                class="w-full appearance-none px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 pr-8 shadow-2xs">
                @for (s of crmState.pipelineStages(); track s.id) {
                  <option [value]="s.id">{{ s.name }}</option>
                }
              </select>
              <span class="absolute inset-y-0 right-0 pr-2.5 flex items-center pointer-events-none text-slate-400">
                <app-icon name="chevron-down" [size]="13"></app-icon>
              </span>
            </div>
          </div>

          <div>
            <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Priority</label>
            <div class="relative">
              <select
                [(ngModel)]="dealPriority"
                name="priority"
                class="w-full appearance-none px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 pr-8 shadow-2xs">
                <option value="Urgent">🔥 Urgent Priority</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
              </select>
              <span class="absolute inset-y-0 right-0 pr-2.5 flex items-center pointer-events-none text-slate-400">
                <app-icon name="chevron-down" [size]="13"></app-icon>
              </span>
            </div>
          </div>

          <div>
            <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Close Date</label>
            <input
              type="date"
              [(ngModel)]="dealCloseDate"
              name="close"
              class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 shadow-2xs">
          </div>
        </div>
      </div>

      <app-dynamic-fields
        entityType="deal"
        [values]="dealCustomFields"
        (valuesChange)="dealCustomFields = $event">
      </app-dynamic-fields>

      <div class="flex items-center justify-end gap-2.5 pt-3 border-t border-slate-200 dark:border-slate-800">
        <button
          type="button"
          (click)="isGlobalDealModalOpen = false"
          class="px-4 py-2 text-xs font-semibold rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition active:scale-95">
          Cancel
        </button>
        <button
          type="submit"
          class="px-5 py-2.5 text-xs font-bold rounded-xl bg-gradient-to-r from-indigo-600 via-indigo-500 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white shadow-lg shadow-indigo-500/25 active:scale-95 transition-all flex items-center gap-1.5">
          <app-icon name="plus" [size]="14"></app-icon>
          <span>Create Opportunity</span>
        </button>
      </div>
    </form>
  </app-modal>

  <!-- Global Quick Email Composer Modal -->
  <app-modal
    [isOpen]="isGlobalEmailModalOpen"
    title="Simulate Client Email Dispatch"
    subtitle="Sends realistic notification & logs to omnichannel timeline"
    icon="mail"
    badge="Mock Mailer"
    maxWidth="600px"
    (close)="isGlobalEmailModalOpen = false">

    <form (ngSubmit)="submitEmail()" class="space-y-4">
      <div class="p-4 rounded-2xl bg-slate-50/80 dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 space-y-3.5">
        <div>
          <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
            Recipient Email <span class="text-rose-500">*</span>
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <app-icon name="mail" [size]="14"></app-icon>
            </span>
            <input
              type="email"
              [(ngModel)]="emailTo"
              name="emailTo"
              required
              placeholder="prospect@company.com"
              class="w-full pl-9 pr-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition shadow-2xs">
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
            Subject Line <span class="text-rose-500">*</span>
          </label>
          <input
            type="text"
            [(ngModel)]="emailSubject"
            name="emailSubject"
            required
            placeholder="e.g. Octax Enterprise Platform Demo & Architecture Walkthrough"
            class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition shadow-2xs">
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
            Message Body & Notes
          </label>
          <textarea
            [(ngModel)]="emailBody"
            name="emailBody"
            rows="5"
            placeholder="Write personalized email content..."
            class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition shadow-2xs resize-none"></textarea>
        </div>
      </div>

      <div class="flex items-center justify-between pt-3 border-t border-slate-200 dark:border-slate-800">
        <span class="text-[11px] text-slate-400 flex items-center gap-1.5 hidden sm:flex">
          <app-icon name="bell" [size]="12"></app-icon>
          <span>Triggers instant sound effect, toast & bell alert</span>
        </span>
        <div class="flex items-center gap-2.5 ml-auto">
          <button
            type="button"
            (click)="isGlobalEmailModalOpen = false"
            class="px-4 py-2 text-xs font-semibold rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition active:scale-95">
            Cancel
          </button>
          <button
            type="submit"
            class="px-5 py-2.5 text-xs font-bold rounded-xl bg-gradient-to-r from-indigo-600 via-indigo-500 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white shadow-lg shadow-indigo-500/25 active:scale-95 transition-all flex items-center gap-1.5">
            <app-icon name="mail" [size]="14"></app-icon>
            <span>Simulate Send Email</span>
          </button>
        </div>
      </div>
    </form>
  </app-modal>

</div>
